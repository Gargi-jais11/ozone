groups:
  - name: ozone
    rules:
      - alert: OzoneDeletionNotProgressing
        # deleting_service_metrics_num_keys_{sent_for_purge,purged} come from
        # OM's DeletingServiceMetrics JMX bean (see recon-rag-service's
        # deletion_not_progressing plugin/runbook). Fires when there is a
        # purge backlog that hasn't shrunk over the evaluation window.
        expr: >
          (deleting_service_metrics_num_keys_sent_for_purge{component="om"}
            - deleting_service_metrics_num_keys_purged{component="om"} > 0)
          and
          (increase(deleting_service_metrics_num_keys_purged{component="om"}[15m]) == 0)
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Ozone Manager key deletion is not progressing"
          description: >
            KeyDeletingService has a purge backlog (numKeysSentForPurge >
            numKeysPurged) that has not shrunk in the last 15 minutes on
            {{ $labels.instance }}.
