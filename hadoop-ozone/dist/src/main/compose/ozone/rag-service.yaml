# Adds the recon-rag-service prototype (see recon-rag-service/README.md) to
# the cluster. Combine with monitoring.yaml so Prometheus is actually running:
#   export COMPOSE_FILE=docker-compose.yaml:monitoring.yaml:rag-service.yaml
#   ./run.sh -d

services:
  recon-rag:
    build:
      context: ./recon-rag-service
    hostname: recon-rag
    ports:
      - 8642:8642
    environment:
      - OM_HTTP_ADDRESS=om:9874
      - SCM_HTTP_ADDRESS=scm:9876
      - RECON_HTTP_ADDRESS=recon:9888
    depends_on:
      - om
      - scm
      - recon
  recon:
    environment:
      - "OZONE-SITE.XML_ozone.recon.prometheus.http.endpoint=http://prometheus:9090"
