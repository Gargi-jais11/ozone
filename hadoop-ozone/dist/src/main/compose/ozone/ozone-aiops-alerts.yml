# Prometheus alerting rules for the recon-rag-service prototype (see
# recon-rag-service/README.md). Recon's Alerts page reads active alerts
# straight from Prometheus's own /api/v1/alerts, so these rules are the only
# thing that makes an alert exist -- there is no Alertmanager in this build.
#
# alertname must match app/plugins/*.py's `alert_type` exactly, since that is
# how recon-rag-service picks which plugin diagnoses the alert.
groups:
  - name: ozone-aiops-alerts
    rules:
      - alert: OzoneDeletionNotProgressing
        expr: >-
          rate(deleting_service_metrics_num_keys_purged[10m]) == 0
          and
          deleting_service_metrics_num_keys_processed > deleting_service_metrics_num_keys_purged
        for: 5m
        labels:
          severity: warning
          component: om
        annotations:
          summary: "Ozone Manager key deletion is not progressing"
          description: >-
            KeyDeletingService has keys queued for purge
            (numKeysProcessed > numKeysPurged) but the purge rate has been
            zero for 5 minutes.
